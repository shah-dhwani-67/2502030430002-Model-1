<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="">
        <fieldset>
            <legend>Personal Details</legend>
            <label for="">First Name</label>
            <input type="text" placeholder="Enter Your First Name Here" required><br><br>

            <label for="">Middle Name</label>
            <input type="text" placeholder="Enter Your middle Name Here" required><br><br>

            <label for="">Last Name</label>
            <input type="text" placeholder="Enter Your last Name Here" required><br><br>

            <label for="">Email</label>
            <input type="email" placeholder="Enter Your email Here" required><br><br>

            <label for="">Mobile No</label>
            <input type="number" placeholder="Enter Your Mobile No Here" maxlength="10" minlength="10" required><br><br>

            <label for="">D.O.B</label>
            <input type="date"><br><br>

            <label for="">Appointment</label>
            <input type="datetime-local"><br><br>

            <label for="">Gender</label>
            <input type="radio" value="male" name="gender">Male
            <input type="radio" value="female" name="gender">Female <br><br>

            <label for="">Country</label>
            <select name="country" id="">
                <option value="">Select</option>
                <option value="">India</option>
                <option value="">Australia</option>
                <option value="">USA</option>
            </select><br><br>

            <label for="">Address & feedback</label>
            <textarea name="address"></textarea>
            <br><br>

            <label for="">File Upload</label>
            <input type="file" multiple><br><br>

            <label for="">Password</label>
            <input type="password"><br><br>

            <label for="">Search</label>
            <input type="search" placeholder="Search Anything"><br><br>

            <label for="">Hobbies</label>
            <input type="checkbox">Musics
            <input type="checkbox">Movies
            <input type="checkbox">Sports
            <input type="checkbox">Reading Books
          <br><br>
            <!--  -->
            <label for="">Month</label>
            <input type="month"><br><br>

            <label for="">Week</label>
            <input type="week"><br><br>

            <label for="">Range</label>
            <input type="range"><br><br>

            <label for="">URL</label>
            <input type="url"><br><br>

            <label for="">Color</label>
            <input type="color"><br><br>
            <input type="submit" value="register">
            <button type="button">Sign In</button>
        </fieldset>
    </form>
</body>

</html>
